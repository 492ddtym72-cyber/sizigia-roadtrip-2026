name: Tricount reconciliation (read-only)

on:
  push:
    branches:
      - agent/tricount-readonly-reconcile
    paths:
      - "tools/tricount_sync/**"
      - ".github/workflows/tricount-reconcile.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/tricount_sync/**"
      - ".github/workflows/tricount-reconcile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/tricount_sync/requirements.txt

      - name: Install reconciliation dependency
        run: python -m pip install -r tools/tricount_sync/requirements.txt

      - name: Reconcile ledgers (strictly read-only)
        env:
          TRICOUNT_TOKEN: ${{ secrets.TRICOUNT_TOKEN }}
          RECONCILE_REPORT: tricount-reconcile-report.json
        run: python tools/tricount_sync/reconcile.py

      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tricount-reconcile-report
          path: tricount-reconcile-report.json
          if-no-files-found: ignore
          retention-days: 7
