name: Add requested expenses once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-requested-expenses-once.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: add-requested-expenses-once
  cancel-in-progress: false

jobs:
  update-expenses:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Append expenses with Firebase ETag protection
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const appSource = fs.readFileSync('app.js', 'utf8');
          const urlMatch = appSource.match(/let\s+CLOUD_URL\s*=\s*['"]([^'"]+\.json)['"]/);
          if (!urlMatch) throw new Error('Firebase endpoint could not be resolved from app.js');
          const cloudUrl = urlMatch[1];

          const requested = [
            {
              id: 'x-exp-20260731-4pro-met',
              date: '2026-07-31T10:45:00.000Z',
              desc: '4 PRO MET für Bernhard, Lukas und Max',
              amount: 50,
              payer: 'c-bernhard',
              sharers: ['c-bernhard', 'c-lukas', 'c-max'],
            },
            {
              id: 'x-exp-20260731-luftmatratze',
              date: '2026-07-31T10:46:00.000Z',
              desc: 'Luftmatratze',
              amount: 29.44,
              payer: 'c-bernhard',
              // Bernhard paid but has a €0.00 personal share; Christoph bears the cost.
              sharers: ['c-christoph'],
            },
          ];

          const normalize = value => String(value || '')
            .normalize('NFKD')
            .replace(/[\u0300-\u036f]/g, '')
            .trim()
            .toLowerCase()
            .replace(/\s+/g, ' ');
          const sameMembers = (a, b) => {
            const left = [...new Set(a || [])].sort();
            const right = [...new Set(b || [])].sort();
            return left.length === right.length && left.every((value, index) => value === right[index]);
          };
          const isDuplicate = (expense, candidate) =>
            expense?.id === candidate.id || (
              normalize(expense?.desc) === normalize(candidate.desc) &&
              Math.abs(Number(expense?.amount) - candidate.amount) < 0.005 &&
              expense?.payer === candidate.payer &&
              sameMembers(expense?.sharers, candidate.sharers)
            );
          const nextTimestamp = previous => {
            const now = Date.now();
            const old = Date.parse(previous || '');
            return new Date(Number.isFinite(old) && old >= now ? old + 1000 : now).toISOString();
          };
          const newLogEntry = expense => ({
            id: `log-${expense.id}`,
            ts: new Date().toISOString(),
            who: 'c-freddi',
            desc: `hat Ausgabe „${expense.desc}“ (${expense.amount.toLocaleString('de-DE', {style:'currency', currency:'EUR'})}, gezahlt von Bernhard) eingetragen`,
            undo: {t: 'expAdd', id: expense.id},
          });

          async function readRemote() {
            const response = await fetch(cloudUrl, {
              headers: {'X-Firebase-ETag': 'true'},
              cache: 'no-store',
            });
            if (!response.ok) throw new Error(`Firebase read failed: HTTP ${response.status}`);
            const etag = response.headers.get('etag');
            if (!etag) throw new Error('Firebase did not return an ETag');
            return {state: await response.json(), etag};
          }

          let result = null;
          for (let attempt = 1; attempt <= 5; attempt++) {
            const {state, etag} = await readRemote();
            if (!state || typeof state !== 'object') throw new Error('Remote state is empty or invalid; refusing to seed it');
            if (!state.budget || (state.budget.expenses !== undefined && !Array.isArray(state.budget.expenses))) {
              throw new Error('Unexpected budget.expenses shape; refusing a potentially destructive write');
            }
            if (state.log !== undefined && !Array.isArray(state.log)) {
              throw new Error('Unexpected log shape; refusing a potentially destructive write');
            }
            const crewIds = new Set((state.crew || []).map(member => member.id));
            const requiredCrew = new Set(requested.flatMap(expense => [expense.payer, ...expense.sharers]));
            for (const crewId of requiredCrew) {
              if (!crewIds.has(crewId)) throw new Error(`Required crew member missing: ${crewId}`);
            }

            const expenses = state.budget.expenses || [];
            const beforeIds = new Set(expenses.map(expense => expense.id).filter(Boolean));
            const additions = requested.filter(candidate => !expenses.some(expense => isDuplicate(expense, candidate)));

            if (!additions.length) {
              result = {added: 0, total: expenses.length, preserved: beforeIds.size, skipped: requested.length};
              break;
            }

            state.budget.expenses = [...expenses, ...additions];
            state.log = state.log || [];
            for (const expense of additions) state.log.push(newLogEntry(expense));
            while (state.log.length > 60) state.log.shift();
            state.meta = state.meta || {};
            state.meta.lastSaved = nextTimestamp(state.meta.lastSaved);

            const write = await fetch(cloudUrl, {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json',
                'If-Match': etag,
              },
              body: JSON.stringify(state),
            });
            if (write.status === 412) {
              console.log(`Concurrent update detected on attempt ${attempt}; reloading safely.`);
              continue;
            }
            if (!write.ok) throw new Error(`Firebase write failed: HTTP ${write.status}`);

            const {state: verified} = await readRemote();
            const verifiedExpenses = verified?.budget?.expenses;
            if (!Array.isArray(verifiedExpenses)) throw new Error('Verification failed: expenses are not an array');
            const verifiedIds = new Set(verifiedExpenses.map(expense => expense.id).filter(Boolean));
            for (const oldId of beforeIds) {
              if (!verifiedIds.has(oldId)) throw new Error(`Verification failed: existing expense disappeared (${oldId})`);
            }
            for (const expense of additions) {
              const matches = verifiedExpenses.filter(row => row.id === expense.id);
              if (matches.length !== 1) throw new Error(`Verification failed for ${expense.id}: expected exactly one entry`);
            }
            result = {
              added: additions.length,
              total: verifiedExpenses.length,
              preserved: beforeIds.size,
              skipped: requested.length - additions.length,
            };
            break;
          }

          if (!result) throw new Error('Firebase remained busy after five safe retries; no unverified write accepted');
          console.log(`RESULT added=${result.added} skipped=${result.skipped} total=${result.total} preserved_existing=${result.preserved}`);
          NODE
