name: Expense balance diagnostics

on:
  push:
    branches: [main]
    paths:
      - "tools/tricount_sync/balance_diagnostics.py"
      - ".github/workflows/balance-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Print live balance breakdown
        run: python tools/tricount_sync/balance_diagnostics.py
