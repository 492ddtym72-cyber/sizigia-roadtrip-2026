name: Tricount ↔ Roadtrip expense sync

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches:
      - agent/tricount-readonly-reconcile
    paths:
      - "tools/tricount_sync/**"
      - ".github/workflows/tricount-sync.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/tricount_sync/**"
      - ".github/workflows/tricount-sync.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: tricount-roadtrip-expense-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Tricount device credentials
        uses: actions/cache@v4
        with:
          path: tricount_credentials.json
          key: tricount-device-credentials-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/tricount_sync/requirements.txt

      - name: Install Tricount dependency
        run: python -m pip install -r tools/tricount_sync/requirements.txt

      - name: Synchronize expense additions
        env:
          TRICOUNT_TOKEN: ${{ secrets.TRICOUNT_TOKEN }}
          TRICOUNT_CREDENTIALS_PATH: tricount_credentials.json
          SYNC_REPORT: tricount-sync-report.json
        run: python tools/tricount_sync/sync_engine.py

      - name: Maintain human-review issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '[expense-sync-review]';
            const title = `${marker} Tricount ↔ Roadtrip needs attention`;
            if (!fs.existsSync('tricount-sync-report.json')) {
              core.warning('No sync report was produced.');
              return;
            }
            const report = JSON.parse(fs.readFileSync('tricount-sync-report.json', 'utf8'));
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(i => !i.pull_request && i.title.startsWith(marker));
            const needsReview = report.status === 'review' || report.status === 'error';

            if (needsReview) {
              const counts = report.counts || {};
              const lines = [
                'The automatic expense synchronizer paused rather than guessing.',
                '',
                `**Status:** ${report.status}`,
                `**Checked:** ${report.timestamp || 'unknown'}`,
                `**Matched:** ${counts.matched ?? 'n/a'} direct + ${counts.compoundMatched ?? 'n/a'} compound`,
                `**Unmatched:** Tricount ${counts.tricountOnly ?? 'n/a'} / Roadtrip ${counts.roadtripOnly ?? 'n/a'}`,
                '',
                'Please review the details below before changing either ledger:',
                '',
                '```json',
                JSON.stringify({
                  error: report.error,
                  conflicts: report.conflicts || [],
                  ambiguous: report.ambiguous || [],
                  tricountOnly: report.tricountOnly || [],
                  roadtripOnly: report.roadtripOnly || [],
                  actionsAlreadyCompleted: report.actions || [],
                }, null, 2),
                '```',
                '',
                'The sync will continue checking, but it will not guess through this conflict.',
              ];
              const body = lines.join('\n');
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  title,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              }
            } else if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                body: `${existing.body || ''}\n\nResolved automatically at ${report.timestamp || 'the latest clean sync'}.`,
              });
            }

      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tricount-sync-report
          path: tricount-sync-report.json
          if-no-files-found: ignore
          retention-days: 7
